# Managed by dotfiles: setup/hooks/thinkfan_hook.sh

sensors:
  - hwmon: /sys/class/hwmon
    name: k10temp
    indices: [1]

  - hwmon: /sys/class/hwmon
    name: amdgpu
    indices: [1]

  - hwmon: /sys/class/hwmon
    name: nvme
    model: SKHynix_HFS512GD9TNI-L2B0B
    indices: [1, 3]

fans:
  - tpacpi: /proc/acpi/ibm/fan

levels:
  - speed: 0
    upper_limit: [75, 75, 65, 75]

  - speed: "level auto"
    lower_limit: [55, 55, 60, 65]
